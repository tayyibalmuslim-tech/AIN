<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحديد مصادر التلقي — أين الطريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#161B22;
    --night-2:#1F2630;
    --gold:#C9A15C;
    --gold-soft:#E8CE9A;
    --olive:#4A5D45;
    --ivory:#F0EAD8;
    --ivory-dim:#B9B2A0;
    --line:#2E3642;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--night);
    color:var(--ivory);
    font-family:'Tajawal',sans-serif;
    line-height:1.9;
    min-height:100vh;
  }
  h1,.eyebrow{font-family:'Amiri',serif;}

  .top-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    font-size:.95rem;
  }
  .top-nav a{
    color:var(--gold-soft);
    text-decoration:none;
  }
  .top-nav a:hover{ color:var(--gold); }

  header{
    text-align:center;
    padding:70px 20px 50px;
    background:radial-gradient(ellipse at top, rgba(201,161,92,.12), transparent 60%);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    display:inline-block;
    color:var(--gold);
    font-size:.95rem;
    letter-spacing:.15em;
    margin-bottom:14px;
    opacity:.85;
  }
  header h1{
    font-size:clamp(2rem,5vw,3rem);
    color:var(--gold-soft);
    font-weight:700;
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:70px 24px;
  }
  .placeholder{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:60px 30px;
    text-align:center;
    color:var(--ivory-dim);
  }
  .placeholder .icon{
    font-size:2rem;
    color:var(--gold);
    margin-bottom:16px;
  }
  .placeholder p{ max-width:420px; margin:0 auto; }

  .bottom-nav{
    display:flex; justify-content:space-between;
    max-width:760px;
    margin:0 auto;
    padding:0 24px 80px;
    font-size:.95rem;
  }
  .bottom-nav a{
    color:var(--ivory-dim);
    text-decoration:none;
    border:1px solid var(--line);
    padding:10px 18px;
    border-radius:8px;
    transition:border-color .2s ease, color .2s ease;
  }
  .bottom-nav a:hover{
    border-color:var(--gold);
    color:var(--gold-soft);
  }
</style>
</head>
<body>
<div style="background:#FFF3CD;border-bottom:2px solid #E0A800;color:#664D03;padding:10px 16px;font-family:'IBM Plex Sans Arabic','Tahoma',sans-serif;font-size:13.5px;line-height:1.7;text-align:center;direction:rtl" role="note">
⚠️ <strong>تنبيه:</strong> هذا المحتوى تم إعداده بمساعدة الذكاء الاصطناعي وقد يحتوي على أخطاء في الشرح والتحليل، يُرجى المراجعة والتحقق خاصة في المسائل الشرعية.
</div>


<nav class="top-nav">
  <a href="../index.html">→ العودة لفهرس السلسلة</a>
  <span style="color:var(--ivory-dim)">أين الطريق</span>
</nav>

<header>
  <span class="eyebrow">الخطوة العاشرة</span>
  <h1>تحديد مصادر التلقي</h1>
</header>

<main>
  <div class="placeholder">
    <div class="icon">◈</div>
    <p>هذه الصفحة جاهزة الآن كإطار فارغ — أضف محتوى هذه الحلقة هنا لاحقًا.</p>
  </div>
</main>

<div class="bottom-nav">
  <a href="../index.html">فهرس السلسلة</a>
</div>

</body>
</html>
